<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/shoopar-64.png">
<link rel="apple-touch-icon" href="icons/shoopar-180.png">
<link rel="stylesheet" href="style.css">
<title>Shoopar</title>
</head>
<body>
<div id="pin" class="pin">
  <div class="pin-card">
    <div class="language-selector" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <span>·</span>
      <button type="button" data-lang="pt">PT</button>
    </div>
    <img src="icons/shoopar-180.png" class="pin-logo" alt="Shoopar">
    <h1>Shoopar</h1>
    <p id="pinText"></p>
    <div class="dots"><i></i><i></i><i></i><i></i></div>
    <div class="keys">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <span></span><button>0</button><button id="back">⌫</button>
    </div>
    <small id="pinError"></small>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="brand"><img src="icons/shoopar-64.png" alt=""><div><div class="eyebrow">SHOOPAR</div><h1 id="appTitle"></h1></div></div>
  <div class="header-actions">
    <div class="language-selector compact" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <span>·</span>
      <button type="button" data-lang="pt">PT</button>
    </div>
    <button id="theme" aria-label="Toggle theme">☾</button><button id="lock" aria-label="Lock">⌑</button>
  </div>
</header>
<nav id="lists"></nav>
<main>
<section class="stats">
  <div><b id="remaining">0</b><span id="remainingLabel"></span></div>
  <div><b id="cost">0,00 €</b><span id="costLabel"></span></div>
</section>
<section class="add">
  <input id="name" maxlength="100">
  <select id="category"></select>
  <div class="row"><input id="price" inputmode="decimal"><input id="qty" inputmode="decimal" value="1"><button id="add" aria-label="Add item">+</button></div>
</section>
<div class="filters"><button class="active" data-filter="all"></button><button data-filter="pending"></button><button data-filter="done"></button></div>
<ul id="items"></ul>
<section class="actions"><button id="history"></button><button id="clear"></button></section>
</main>
<div id="modal" class="modal" hidden><div class="modal-card"><button id="closeModal" class="close" aria-label="Close">×</button><h2 id="historyTitle"></h2><div id="historyList"></div></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
